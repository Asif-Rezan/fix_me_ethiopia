# Native launcher assets are imported from the supplied EasyAppIcon exports.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/brand/launcher_icon.png
  min_sdk_android: 23
  adaptive_icon_background: '#FAFAFA'
  adaptive_icon_foreground: assets/brand/launcher_foreground.png
  adaptive_icon_foreground_inset: 0
  remove_alpha_ios: true
  background_color_ios: '#FFFFFF'
